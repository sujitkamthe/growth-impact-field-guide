<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The header's reach mark, drawn heavier so the rings hold at tab size. -->
  <style>
    .ink { fill: none; stroke: #18181B; stroke-width: 2; }
    .band { fill: #18181B; fill-opacity: 0.45; }
    @media (prefers-color-scheme: dark) {
      .ink { stroke: #FAFAFA; }
      .band { fill: #FAFAFA; }
    }
  </style>
  <path class="band" fill-rule="evenodd" d="M6.7,16 a9.3,9.3 0 1,0 18.6,0 a9.3,9.3 0 1,0 -18.6,0 Z M11.3,16 a4.7,4.7 0 1,0 9.4,0 a4.7,4.7 0 1,0 -9.4,0 Z"/>
  <circle class="ink" cx="16" cy="16" r="4.7"/>
  <circle class="ink" cx="16" cy="16" r="9.3"/>
  <circle class="ink" cx="16" cy="16" r="14" stroke-opacity="0.55"/>
</svg>
